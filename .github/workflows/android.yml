name: Android build and device tests

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "store-assets/**"
      - "downloads/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "store-assets/**"
      - "downloads/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK and unsigned bundle, unit tests, and lint
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease :app:testDebugUnitTest :app:lintDebug :app:lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: PaperPocket-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PaperPocket-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: google_apis
            label: api-26
            page-size: 4096
          - api-level: 36
            target: google_apis
            label: api-36
            page-size: 4096
          - api-level: 36
            target: google_apis_ps16k
            label: api-36-16kb
            page-size: 16384
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = "${{ matrix.page-size }}"
            if [ "${{ matrix.page-size }}" = "16384" ]; then adb root; adb wait-for-device; adb shell setprop bionic.linker.16kb.app_compat.enabled false; adb shell setprop pm.16kb.app_compat.disabled true; fi
            gradle --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-reports-${{ matrix.label }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

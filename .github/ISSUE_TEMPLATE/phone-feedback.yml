name: Phone testing feedback
description: Report a bug or suggest an improvement in the PaperPocket beta.
title: "[Phone feedback] "
body:
  - type: input
    id: app_version
    attributes:
      label: PaperPocket version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      placeholder: "Phone model, Android 14"
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What happened or what would you improve?
      description: Include steps, the full error text, and what you expected. Redact private documents from screenshots.
    validations:
      required: true
  - type: textarea
    id: pdf_size
    attributes:
      label: PDF size and quality, if relevant
      placeholder: "4 pages; Balanced; original 11 MB; smaller copy 3 MB; text readable/unreadable"
